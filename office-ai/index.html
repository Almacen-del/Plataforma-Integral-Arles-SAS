<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asistente Arles</title><link rel="stylesheet" href="style.css"><script src="plugins-9.4.0.js"></script><script type="module" src="plugin.js"></script></head>
<body><header><img src="icon.svg" alt=""><div><strong>Asistente Arles</strong><small id="editor-name">IA para tus documentos</small></div><button type="button" class="secondary" id="new-chat" aria-label="Nueva conversación">Nuevo chat</button></header>
<main tabindex="0" aria-label="Consulta y respuesta del asistente"><p class="intro" id="intro">Pregunta por el contenido abierto o prepara una propuesta para revisarla.</p>

<p id="status" role="status">Conectando con el editor…</p><p id="error" role="alert" hidden></p>
<div id="messages" role="log" aria-label="Conversación"></div><section id="result" hidden><h2>Respuesta</h2><div id="answer"></div><button type="button" class="secondary" id="copy">Copiar respuesta</button><section id="proposal" hidden><h2>Propuesta para revisar</h2><p id="target"></p><div id="preview"></div><div class="apply-actions"><button type="button" id="apply">Aplicar</button><button type="button" id="replace" class="secondary" hidden>Reemplazar selección</button></div><p id="applied" role="status"></p></section></section>
</main><form id="compose"><label for="mode">¿Qué necesitas?</label><select id="mode"><option value="ask">Consultar y explicar</option><option value="propose" id="propose-mode">Preparar cambios</option></select><label for="question">Tu mensaje</label><textarea id="question" maxlength="2000" rows="2" placeholder="Escribe lo que necesitas…" required></textarea><div class="examples" id="examples"></div><div class="form-actions"><button id="send" disabled>Enviar mensaje</button><button id="cancel" type="button" class="secondary" hidden>Cancelar</button></div></form><footer>Se envían a Groq tu solicitud y el fragmento consultado. Los cambios se incorporan al editor al pulsar Aplicar.</footer></body></html>
